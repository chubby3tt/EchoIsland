<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Dynamic Island</title>
    <style>
        /* ==========================================
           1. GLASS MORPHIC DYNAMIC ISLAND LAYOUT
           ========================================== */
        body {
            margin: 0;
            padding: 0;
            background: #000; /* Dark canvas backplane */
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .iris-hud-wrapper {
            display: flex;
            justify-content: center;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .iris-dynamic-island {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 16, 26, 0.75); /* High-end dark slate glass block */
            backdrop-filter: blur(25px); /* Liquid acrylic filter opacity */
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 0 24px;
            width: 360px;
            height: 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); /* Fluid sizing speeds */
            margin-top: 5px;
        }

        /* Color Matrix Notification Wrappers */
        .iris-dynamic-island.listening { border-color: #00f0ff; box-shadow: 0 0 15px rgba(0,240,255,0.2); }
        .iris-dynamic-island.thinking { border-color: #ffaa00; box-shadow: 0 0 15px rgba(255,170,0,0.2); }
        .iris-dynamic-island.speaking { border-color: #00ff55; box-shadow: 0 0 15px rgba(0,255,85,0.2); }

        .accent-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        .iris-text-display {
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* ==========================================
           2. LEFT LOADING SPINNER ANIMATION
           ========================================== */
        .circular-loader {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #00f0ff;
            border-radius: 50%;
            display: none;
            animation: spinRing 0.8s linear infinite;
        }

        .thinking .circular-loader, .speaking .circular-loader {
            display: block;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        /* ==========================================
           3. RIGHT CHATGPT VOICE BUBBLE (BREATHING)
           ========================================== */
        .chatgpt-bubble {
            width: 10px;
            height: 10px;
            background: #ffffff; /* Small and white */
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .listening .chatgpt-bubble, .speaking .chatgpt-bubble {
            animation: bubbleBreath 1.5s infinite ease-in-out;
        }

        @keyframes bubbleBreath {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 8px #ffffff; }
        }
    </style>
</head>
<body>

    <div class="iris-hud-wrapper">
        <div id="islandPill" class="iris-dynamic-island">
            <!-- LEFT AREA: Ring Spinner Loader -->
            <div class="accent-zone">
                <div class="circular-loader"></div>
            </div>

            <!-- CENTER AREA: Interactive Interface Readout -->
            <div class="iris-text-display" id="hudText">IRIS STANDBY</div>

            <!-- RIGHT AREA: Small White Breathing ChatGPT Bubble -->
            <div class="accent-zone">
                <div class="chatgpt-bubble"></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 4. PUSH-TO-TALK & SPEECH ROUTING CORE
        // ==========================================
        const pill = document.getElementById('islandPill');
        const textDisplay = document.getElementById('hudText');
        
        let recognition;
        let isKeyPressed = false;
        const PTT_KEY = 'CapsLock'; // Hotkey mapping

        // Initialize Native Client Browser Speech Engine
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                updateState('listening', 'IRIS: LISTENING...');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                updateState('thinking', 'PROCESSING...');
                processSafeCommand(transcript);
            };

            recognition.onerror = () => updateState('standby', 'IRIS STANDBY');
            recognition.onend = () => { if (!isKeyPressed) updateState('standby', 'IRIS STANDBY'); };
        }

        // Monitor Global Keyboard Hold Window States
        window.addEventListener('keydown', (e) => {
            if (e.key === PTT_KEY && !isKeyPressed) {
                isKeyPressed = true;
                recognition?.start();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === PTT_KEY) {
                isKeyPressed = false;
                recognition?.stop();
            }
        });

        function updateState(statusClass, textMessage) {
            pill.className = `iris-dynamic-island ${statusClass}`;
            textDisplay.innerText = textMessage;
        }

        // ==========================================
        // 5. THE SECURE RUNTIME PIPELINE (NO DELETIONS)
        // ==========================================
        function processSafeCommand(command) {
            // STRICT SAFETY BLOCKS: Hardstop string interceptor
            const forbidden = ["delete", "remove", "destroy", "uninstall", "format", "del", "recycle"];
            if (forbidden.some(word => command.includes(word))) {
                triggerIrisVoice("Access denied. System modification protocols are blacklisted.");
                return;
            }

            // SAFE CONTEXT SHORTCUTS
            if (command.includes("youtube")) {
                triggerIrisVoice("Opening YouTube.");
                window.open("https://youtube.com", "_blank");
            } else if (command.includes("google")) {
                triggerIrisVoice("Opening Google.");
                window.open("https://google.com", "_blank");
            } else {
                triggerIrisVoice("Command recognized but path not mapped.");
            }
        }

        // ==========================================
        // 6. OFFLINE IRIS ASSISTANT VOICE MATRIX
        // ==========================================
        function triggerIrisVoice(speechOutput) {
            updateState('speaking', speechOutput);
            
            const utter = new SpeechSynthesisUtterance(speechOutput);
            const voices = window.speechSynthesis.getVoices();
            
            // Lock target strictly to offline device female drivers (Zira or Hazel)
            const femaleVoice = voices.find(v => v.name.includes("Zira") || v.name.includes("Hazel"));
            if (femaleVoice) utter.voice = femaleVoice;
            
            utter.rate = 1.05; // Quick assistant cadence
            utter.onend = () => updateState('standby', 'IRIS STANDBY');
            
            window.speechSynthesis.speak(utter);
        }
    </script>
</body>
</html>
