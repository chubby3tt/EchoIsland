<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Iris 2.0 — EDITH</title>
<style>
  :root {
    --accent: #00f0ff;
    --text: #edf5ff;
    --muted: #acbcd0;
    --glass: rgba(10, 16, 26, 0.85);
    color-scheme: dark;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: transparent;
    color: var(--text);
  }

  button, input { font: inherit; }
  button { cursor: pointer; }

  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .stage {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(380px, calc(100vw - 24px));
    max-height: calc(100dvh - 24px);
    padding: 2px;
    overflow: auto;
    scrollbar-width: thin;
  }

  .glass {
    background: var(--glass);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
  }

  .capsule {
    --glow: rgba(255, 255, 255, 0.3);
    position: relative;
    flex-shrink: 0;
    height: 50px;
    width: 100%;
    border-radius: 28px;
    border-color: var(--glow);
    border-style: solid;
    border-width: 1px;
    box-shadow:
      0 0 14px color-mix(in srgb, var(--glow) 25%, transparent),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }

  .capsule.listening { --glow: #00f0ff; }
  .capsule.thinking { --glow: #ffaa00; }
  .capsule.speaking { --glow: #00ff55; }
  .capsule.denied { --glow: #ff5475; }

  .cluster {
    position: absolute;
    inset: 0 auto 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }

  .bubble {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
  }

  .spinner {
    width: 17px;
    height: 17px;
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-top-color: white;
    border-radius: 50%;
    opacity: 0.45;
  }

  .listening .bubble,
  .speaking .bubble {
    animation: breathe 1.2s ease-in-out infinite;
    will-change: transform;
  }

  .thinking .spinner {
    animation: spin 800ms linear infinite;
    opacity: 1;
    will-change: transform;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.82); }
    50% { transform: scale(1.12); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .gear {
    position: absolute;
    right: 7px;
    top: 6px;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: white;
    opacity: 0;
    transition: opacity 140ms ease, background 140ms ease;
  }

  .capsule:hover .gear,
  .capsule:focus-within .gear,
  .gear[aria-expanded="true"] {
    opacity: 1;
  }

  .gear:hover { background: rgba(255, 255, 255, 0.1); }
  .gear svg { width: 21px; height: 21px; vertical-align: middle; }

  .drawer {
    order: -1;
    flex-shrink: 0;
    padding: 16px;
    border-radius: 18px;
    border-top: 2px solid var(--accent);
    max-height: min(480px, 52dvh);
    overflow: auto;
    scrollbar-width: thin;
  }

  .heading, .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  h1 { font-size: 15px; margin: 0; letter-spacing: 0.06em; }
  p { margin: 0; }

  .note {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.55;
  }

  .drawer .note { margin: 10px 0; }

  label {
    display: block;
    margin-top: 11px;
    color: var(--muted);
    font-size: 12px;
  }

  input {
    width: 100%;
    min-width: 0;
    padding: 9px 10px;
    border: 1px solid rgba(255, 255, 255, 0.17);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.22);
    color: var(--text);
  }

  label input { display: block; margin-top: 5px; }
  input[type="color"] { height: 36px; padding: 3px; cursor: pointer; }

  .button {
    padding: 8px 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
  }

  .button:hover { background: rgba(255, 255, 255, 0.13); }
  .primary { border-color: var(--accent); background: rgba(0, 240, 255, 0.15); }
  .danger { border-color: #ff5475; background: rgba(255, 84, 117, 0.1); }

  .transcript {
    flex-shrink: 0;
    max-height: 0;
    padding: 0 13px;
    margin-top: -10px;
    overflow: hidden;
    border: 0;
    border-radius: 16px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-9px);
    transition: transform 180ms ease, opacity 180ms ease, max-height 180ms ease, padding 180ms ease;
    pointer-events: none;
  }

  .transcript.visible {
    max-height: min(280px, 34dvh);
    padding: 13px;
    margin-top: 0;
    overflow: auto;
    border: 1px solid rgba(255, 255, 255, 0.17);
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
    scrollbar-width: thin;
  }

  .transcript.error {
    border: 2px solid #ff5475;
    box-shadow: 0 0 18px rgba(255, 84, 117, 0.15);
  }

  .transcript-title {
    margin-bottom: 7px;
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .error .transcript-title { color: #ff91a6; }

  .response {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .response:last-child { margin-bottom: 0; }

  pre {
    margin: 8px 0;
    padding: 10px;
    overflow: auto;
    border-radius: 9px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font: 12px/1.5 Consolas, monospace;
    tab-size: 2;
  }

  code { font: inherit; }
  a { color: var(--accent); overflow-wrap: anywhere; }

  .surface, .runway {
    flex-shrink: 0;
    padding: 12px;
    border-radius: 16px;
  }

  .surface label { margin: 0 0 7px; }
  .command-row { display: flex; gap: 7px; }
  .surface .note { margin-top: 8px; }
  .surface .actions { margin-top: 9px; justify-content: flex-start; }

  .runway-title {
    margin-bottom: 9px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  canvas {
    display: block;
    width: 340px;
    max-width: 100%;
    height: 60px;
    margin: auto;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .runway .actions { margin-top: 9px; display: flex; gap: 8px; }
  .status { min-height: 17px; margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .suspended * { animation-play-state: paused !important; }

  @media (hover: none) {
    .gear { opacity: 0.7; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
