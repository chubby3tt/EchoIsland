name: Build Iris Desktop App
on:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Project Node Modules
        run: npm install

      - name: Compile Standalone Iris Windows App
        run: npm run desktop:build

      - name: Upload Finished Executable Asset
        uses: actions/upload-artifact@v4
        with:
          name: Iris-Dynamic-Island-Installer
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
